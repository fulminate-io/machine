version: "2"
run:
  go: '1.27'
  timeout: 5m
# include test files or not, default is true
  tests: false
linters:
  # please, do not use `default: all`: it's not scalable during updates of golangci-lint
  default: none
  enable:
    - revive
    - bodyclose
    - dogsled
    - dupl
    - errcheck
    - exhaustive
    - funlen
    - goconst
    # - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - nolintlint
    - rowserrcheck
    - copyloopvar
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    revive:
      severity: warning
      rules:
      - name: argument-limit
        severity: error
        arguments: [5]
      - name: atomic
        severity: error
      - name: bare-return
        severity: error
      - name: blank-imports
        severity: error
      - name: bool-literal-in-expr
        severity: error
      - name: call-to-gc
        severity: error
      - name: cognitive-complexity
        severity: error
        arguments: [15]
      - name: confusing-results
        severity: error
      - name: constant-logical-expr
        severity: error
      - name: context-as-argument
        severity: error
      - name: context-keys-type
        severity: error
      - name: cyclomatic
        severity: error
        arguments: [10]
      - name: datarace
        severity: error
      - name: deep-exit
        severity: error
      - name: defer
        severity: error
        arguments: [["call-chain","loop"]]
      - name: dot-imports
        severity: error
      - name: duplicated-imports
        severity: error
      - name: early-return
        severity: error
      - name: empty-block
        severity: error
      - name: empty-lines
        severity: error
      - name: error-naming
        severity: error
      - name: error-return
        severity: error
      - name: error-strings
        severity: error
      - name: errorf
        severity: error
      - name: exported
        severity: error
      - name: function-length
        severity: error
        arguments: [20,0]
      - name: function-result-limit
        severity: error
        arguments: [3]
      - name: get-return
        severity: error
      - name: identical-branches
        severity: error
      - name: if-return
      - name: import-shadowing
        severity: error
      - name: increment-decrement
        severity: error
      - name: indent-error-flow
        severity: error
      - name: line-length-limit
        severity: error
        arguments: [120]
      - name: max-public-structs
        severity: error
        arguments: [10]
      - name: modifies-parameter
        severity: error
      - name: modifies-value-receiver
        severity: error
      - name: nested-structs
        severity: error
      - name: optimize-operands-order
        severity: error
      - name: package-comments
        severity: error
      - name: range
        severity: error
      - name: range-val-address
        severity: error
      - name: range-val-in-closure
        severity: error
      - name: receiver-naming
        severity: error
      - name: redefines-builtin-id
        severity: error
      - name: string-format
        severity: error
      - name: string-of-int
        severity: error
      - name: struct-tag
        severity: error
      - name: superfluous-else
        severity: error
      - name: time-equal
        severity: error
      - name: time-naming
        severity: error
      - name: unconditional-recursion
        severity: error
      - name: unexported-return
        severity: error
      - name: unhandled-error
        severity: error
      - name: unnecessary-stmt
        severity: error
      - name: unreachable-code
        severity: error
      - name: unused-parameter
        severity: error
      - name: unused-receiver
        severity: error
      - name: use-any
        severity: error
      - name: useless-break
        severity: error
      - name: var-declaration
        severity: error
      - name: var-naming
        severity: error
      - name: waitgroup-by-value
        severity: error
    exhaustive:
      default-signifies-exhaustive: true
    funlen:
      lines: 100
      statements: 50
    goconst:
      min-len: 2
      min-occurrences: 2
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - dupImport # https://github.com/go-critic/go-critic/issues/845
        - octalLiteral
        - whyNoLint
        - ifElseChain
    gocyclo:
      min-complexity: 10
    govet:
      enable:
        - shadow
    lll:
      line-length: 140
    misspell:
      locale: US
    nolintlint:
      allow-unused: false # report any unused nolint directives
      require-explanation: false # don't require an explanation for nolint directives
      require-specific: false # don't require nolint directives to be specific about which linter is being skipped
  exclusions:
    generated: lax
    rules:
      # ignore the false positive erros resulting from not including a comment above every `package` keyword
      - linters:
          - revive
        text: should have a package comment, unless it's in another file for this package (golint)
      # errcheck: Almost all programs ignore errors on these functions and in most cases it's ok
      - linters:
          - errcheck
        text: Error return value of .((os\.)?std(out|err)\..*|.*Close|.*Flush|os\.Remove(All)?|.*printf?|os\.(Un)?Setenv). is not checked
      # golint: False positive when tests are defined in package 'test'
      - linters:
          - revive
        text: func name will be used as test\.Test.* by other packages, and that stutters; consider calling this
      # staticcheck: Developers tend to write in C-style with an
      # explicit 'break' in a 'switch', so it's ok to ignore
      - linters:
          - staticcheck
        text: ineffective break statement. Did you mean to break out of the outer loop
      # gosec: Too many false-positives on 'unsafe' usage
      - linters:
          - gosec
        text: Use of unsafe calls should be audited
      # gosec: Too many false-positives for parametrized shell calls
      - linters:
          - gosec
        text: Subprocess launch(ed with variable|ing should be audited)
      # gosec: Duplicated errcheck checks
      - linters:
          - gosec
        text: G104
      # gosec: Unsafe defer
      - linters:
          - gosec
        text: G307
      # gosec: Too many issues in popular repos
      - linters:
          - gosec
        text: (Expect directory permissions to be 0750 or less|Expect file permissions to be 0600 or less)
      # gosec: False positive is triggered by 'src, err := ioutil.ReadFile(filename)'
      - linters:
          - gosec
        text: Potential file inclusion via variable
formatters:
  enable:
    - gofmt
    - goimports
