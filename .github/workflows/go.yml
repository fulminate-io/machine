name: Go

on:
  push:
    branches: [master, v2, v3, v4]
    paths:
      - "**.go"
      - "**.mod"
      - "**.sum"
      - "**.yml"
      - "**.flow"
      - "**.ebnf"
  pull_request:
    branches: [master, v2, v3, v4]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go 1.x
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
        id: go

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          github-token: ${{ github.token }}
          only-new-issues: true

      - name: Get dependencies
        run: go mod vendor

      - name: Go Test
        run: go test -timeout 120s -coverprofile=coverage.out

      # The floor is the coverage the suite actually achieves, so a change that drops
      # below it fails here rather than surfacing later in a coverage report.
      - name: Enforce coverage floor
        env:
          COVERAGE_FLOOR: "100"
        run: |
          total=$(go tool cover -func=coverage.out | awk '$1 == "total:" { print $NF }')
          test -n "$total" || { echo "coverage.out yielded no total line"; exit 1; }
          echo "total statement coverage: $total"
          awk -v got="${total%\%}" -v floor="$COVERAGE_FLOOR" 'BEGIN {
            if (got + 0 < floor + 0) {
              printf "coverage %s%% is below the %s%% floor\n", got, floor
              exit 1
            }
          }'

      - name: Run codacy-coverage-reporter
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_TOKEN }}
          coverage-reports: "coverage.out"
          force-coverage-parser: go
          language: go

  # The edge modules are SEPARATE Go modules: a root-scoped `go list ./...` prints only
  # the root package, which is the exact mechanism by which they rotted against v3
  # invisibly. They get a job each so that cannot happen again.
  edge-http:
    name: edge/http
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'edge/http/go.mod'
          cache-dependency-path: 'edge/http/go.sum'
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: edge/http
          args: --config ${{ github.workspace }}/.golangci.yml
          github-token: ${{ github.token }}
          only-new-issues: true
      - name: Go Build
        working-directory: edge/http
        run: go build ./...
      - name: Go Test
        working-directory: edge/http
        run: go test -timeout 600s ./...

  edge-pubsub:
    name: edge/pubsub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'edge/pubsub/go.mod'
          cache-dependency-path: 'edge/pubsub/go.sum'
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: edge/pubsub
          args: --config ${{ github.workspace }}/.golangci.yml
          github-token: ${{ github.token }}
          only-new-issues: true
      - name: Go Build
        working-directory: edge/pubsub
        run: go build ./...
      - name: Go Test
        working-directory: edge/pubsub
        run: go test -timeout 600s ./...

  # lang/ast is a separate module for the same reason the edge modules are: a
  # root-scoped `go list ./...` prints only the root package, so without a job of
  # its own it would rot invisibly. It carries no cache-dependency-path because a
  # dependency-free module has no go.sum, and pointing the cache at a file that
  # does not exist fails the job rather than missing the cache.
  lang-ast:
    name: lang/ast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'lang/ast/go.mod'
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: lang/ast
          args: --config ${{ github.workspace }}/.golangci.yml
          github-token: ${{ github.token }}
          only-new-issues: true
      - name: Go Build
        working-directory: lang/ast
        run: go build ./...
      - name: Go Test
        working-directory: lang/ast
        run: go test -timeout 600s ./...
