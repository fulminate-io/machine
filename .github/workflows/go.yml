name: Go

on:
  push:
    branches: [master, v2, v3, v4]
    paths:
      - "**.go"
      - "**.mod"
      - "**.sum"
      - "**.yml"
  pull_request:
    branches: [master, v2, v3, v4]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go 1.x
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
        id: go

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          github-token: ${{ github.token }}
          only-new-issues: true

      - name: Get dependencies
        run: go mod vendor

      - name: Go Test
        run: go test -timeout 120s -coverprofile=coverage.out

      # The floor is the coverage the suite actually achieves, so a change that drops
      # below it fails here rather than surfacing later in a coverage report.
      - name: Enforce coverage floor
        env:
          COVERAGE_FLOOR: "99"
        run: |
          total=$(go tool cover -func=coverage.out | awk '$1 == "total:" { print $NF }')
          test -n "$total" || { echo "coverage.out yielded no total line"; exit 1; }
          echo "total statement coverage: $total"
          awk -v got="${total%\%}" -v floor="$COVERAGE_FLOOR" 'BEGIN {
            if (got + 0 < floor + 0) {
              printf "coverage %s%% is below the %s%% floor\n", got, floor
              exit 1
            }
          }'

      - name: Run codacy-coverage-reporter
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_TOKEN }}
          coverage-reports: "coverage.out"
          force-coverage-parser: go
          language: go
