name: Go

on:
  push:
    branches: [master, v2, v3, v4]
    paths:
      - "**.go"
      - "**.mod"
      - "**.sum"
      - "**.yml"
      - "**.flow"
      - "**.ebnf"
  pull_request:
    branches: [master, v2, v3, v4]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go 1.x
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
        id: go

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          github-token: ${{ github.token }}
          only-new-issues: true

      - name: Get dependencies
        run: go mod vendor

      - name: Go Test
        run: go test -timeout 120s -coverprofile=coverage.out

      # The floor is the coverage the suite actually achieves, so a change that drops
      # below it fails here rather than surfacing later in a coverage report.
      - name: Enforce coverage floor
        env:
          COVERAGE_FLOOR: "100"
        run: |
          total=$(go tool cover -func=coverage.out | awk '$1 == "total:" { print $NF }')
          test -n "$total" || { echo "coverage.out yielded no total line"; exit 1; }
          echo "total statement coverage: $total"
          awk -v got="${total%\%}" -v floor="$COVERAGE_FLOOR" 'BEGIN {
            if (got + 0 < floor + 0) {
              printf "coverage %s%% is below the %s%% floor\n", got, floor
              exit 1
            }
          }'

      - name: Run codacy-coverage-reporter
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_TOKEN }}
          coverage-reports: "coverage.out"
          force-coverage-parser: go
          language: go

  # The edge modules are SEPARATE Go modules: a root-scoped `go list ./...` prints only
  # the root package, which is the exact mechanism by which they rotted against v3
  # invisibly. They get a job each so that cannot happen again.
  edge-http:
    name: edge/http
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'edge/http/go.mod'
          cache-dependency-path: 'edge/http/go.sum'
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: edge/http
          args: --config ${{ github.workspace }}/.golangci.yml
          github-token: ${{ github.token }}
          only-new-issues: true
      - name: Go Build
        working-directory: edge/http
        run: go build ./...
      - name: Go Test
        working-directory: edge/http
        run: go test -timeout 600s ./...

  edge-pubsub:
    name: edge/pubsub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'edge/pubsub/go.mod'
          cache-dependency-path: 'edge/pubsub/go.sum'
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: edge/pubsub
          args: --config ${{ github.workspace }}/.golangci.yml
          github-token: ${{ github.token }}
          only-new-issues: true
      - name: Go Build
        working-directory: edge/pubsub
        run: go build ./...
      - name: Go Test
        working-directory: edge/pubsub
        run: go test -timeout 600s ./...

  # lang/ast is a separate module for the same reason the edge modules are: a
  # root-scoped `go list ./...` prints only the root package, so without a job of
  # its own it would rot invisibly. It carries no cache-dependency-path because a
  # dependency-free module has no go.sum, and pointing the cache at a file that
  # does not exist fails the job rather than missing the cache.
  lang-ast:
    name: lang/ast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'lang/ast/go.mod'
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: lang/ast
          args: --config ${{ github.workspace }}/.golangci.yml
          github-token: ${{ github.token }}
          only-new-issues: true
      - name: Go Build
        working-directory: lang/ast
        run: go build ./...
      - name: Go Test
        working-directory: lang/ast
        run: go test -timeout 600s -coverprofile=coverage.out ./...

      # The floor is the coverage the suite actually achieves, so a change that
      # drops below it fails here rather than surfacing later in a coverage
      # report. It was measured against this suite rather than copied from the
      # root job: the marker methods that seal the AST have empty bodies and so
      # contribute no statements, which is why a parser package reaches the same
      # number the runtime does.
      - name: Enforce coverage floor
        working-directory: lang/ast
        env:
          COVERAGE_FLOOR: "100"
        run: |
          total=$(go tool cover -func=coverage.out | awk '$1 == "total:" { print $NF }')
          test -n "$total" || { echo "coverage.out yielded no total line"; exit 1; }
          echo "total statement coverage: $total"
          awk -v got="${total%\%}" -v floor="$COVERAGE_FLOOR" 'BEGIN {
            if (got + 0 < floor + 0) {
              printf "coverage %s%% is below the %s%% floor\n", got, floor
              exit 1
            }
          }'

  # lang/analysis is a separate module for the same reason lang/ast is: a
  # root-scoped `go list ./...` prints only the root package, so without a job of
  # its own it would rot invisibly. It carries a cache-dependency-path because the
  # module HAS a go.sum: lang/analysis requires lang/loader, which brings
  # golang.org/x/tools with it, so the cache is pointed at that file exactly as
  # the lang-loader and lang-lsp jobs point at theirs.
  lang-analysis:
    name: lang/analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'lang/analysis/go.mod'
          cache-dependency-path: 'lang/analysis/go.sum'
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: lang/analysis
          args: --config ${{ github.workspace }}/.golangci.yml
          github-token: ${{ github.token }}
          only-new-issues: true
      - name: Go Build
        working-directory: lang/analysis
        run: go build ./...
      - name: Go Test
        working-directory: lang/analysis
        run: go test -timeout 600s -coverprofile=coverage.out ./...

      # The floor is the coverage the suite actually achieves, so a change that
      # drops below it fails here rather than surfacing later in a coverage
      # report. It was MEASURED against this suite rather than copied from the
      # lang/ast job above: that job reaches 100 because the marker methods
      # sealing the AST have empty bodies and contribute no statements, and an
      # analysis module has no such property. What sits below 100 here is error
      # paths — a prerequisite result arriving with the wrong type, a corpus file
      # that cannot be read — which are reachable but not worth a fixture each.
      - name: Enforce coverage floor
        working-directory: lang/analysis
        env:
          COVERAGE_FLOOR: "96"
        run: |
          total=$(go tool cover -func=coverage.out | awk '$1 == "total:" { print $NF }')
          test -n "$total" || { echo "coverage.out yielded no total line"; exit 1; }
          echo "total statement coverage: $total"
          awk -v got="${total%\%}" -v floor="$COVERAGE_FLOOR" 'BEGIN {
            if (got + 0 < floor + 0) {
              printf "coverage %s%% is below the %s%% floor\n", got, floor
              exit 1
            }
          }'

  # raft is a separate module for the same reason the edge and lang modules are: a
  # root-scoped `go list ./...` prints only the root package, so without a job of
  # its own it would rot invisibly. Unlike lang/ast it HAS a go.sum, so the cache
  # is pointed at it; every step that runs a command carries working-directory
  # raft, because one that does not would build, test or measure the root module
  # and report a green about the wrong code entirely.
  raft:
    name: raft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'raft/go.mod'
          cache-dependency-path: 'raft/go.sum'
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: raft
          args: --config ${{ github.workspace }}/.golangci.yml
          github-token: ${{ github.token }}
          only-new-issues: true
      - name: Go Build
        working-directory: raft
        run: go build ./...
      - name: Go Test
        working-directory: raft
        run: go test -timeout 600s -coverprofile=coverage.out ./...

      # The floor is the coverage the suite actually achieves, so a change that
      # drops below it fails here rather than surfacing later in a coverage
      # report. It is measured against this suite rather than copied from the
      # root and lang/ast jobs: those cover a runtime and a parser whose error
      # paths are all reachable in-process, whereas a transport's paths run
      # through real listeners and real connections. This workflow is the one
      # place the number is declared — the module gate reads it from here.
      - name: Enforce coverage floor
        working-directory: raft
        env:
          COVERAGE_FLOOR: "90"
        run: |
          total=$(go tool cover -func=coverage.out | awk '$1 == "total:" { print $NF }')
          test -n "$total" || { echo "coverage.out yielded no total line"; exit 1; }
          echo "total statement coverage: $total"
          awk -v got="${total%\%}" -v floor="$COVERAGE_FLOOR" 'BEGIN {
            if (got + 0 < floor + 0) {
              printf "coverage %s%% is below the %s%% floor\n", got, floor
              exit 1
            }
          }'

  # lang/lint is a separate module for the same reason the lang and edge modules
  # are: a root-scoped `go list ./...` prints only the root package, so without a
  # job of its own it would rot invisibly. It carries a cache-dependency-path
  # because the module HAS a go.sum: lang/analysis requires lang/loader, which
  # brings golang.org/x/tools with it, and lang/lint consumes lang/analysis, so
  # the cache is pointed at that file exactly as the lang-loader and lang-lsp jobs
  # point at theirs. Every step that runs a command carries working-directory
  # lang/lint, because one that does not would build, test or measure the root
  # module and report a green about the wrong code entirely.
  lang-lint:
    name: lang/lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'lang/lint/go.mod'
          cache-dependency-path: 'lang/lint/go.sum'
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: lang/lint
          args: --config ${{ github.workspace }}/.golangci.yml
          github-token: ${{ github.token }}
          only-new-issues: true
      - name: Go Build
        working-directory: lang/lint
        run: go build ./...
      - name: Go Test
        working-directory: lang/lint
        run: go test -timeout 600s -coverprofile=coverage.out ./...

      # The floor is the coverage the suite actually achieves, so a change that
      # drops below it fails here rather than surfacing later in a coverage
      # report. It was MEASURED against this suite rather than copied from the
      # lang/ast or lang/analysis jobs above. What sits below 100 is two things
      # neither worth a fixture: the write-error paths, which need an io.Writer
      # that fails and this module's callers all hand it a real stream; and the
      # process-exiting main, whose whole body is the os.Exit that run's own
      # in-process tests exist to avoid.
      - name: Enforce coverage floor
        working-directory: lang/lint
        env:
          COVERAGE_FLOOR: "93"
        run: |
          total=$(go tool cover -func=coverage.out | awk '$1 == "total:" { print $NF }')
          test -n "$total" || { echo "coverage.out yielded no total line"; exit 1; }
          echo "total statement coverage: $total"
          awk -v got="${total%\%}" -v floor="$COVERAGE_FLOOR" 'BEGIN {
            if (got + 0 < floor + 0) {
              printf "coverage %s%% is below the %s%% floor\n", got, floor
              exit 1
            }
          }'

  # lang/lsp is a separate module for the same reason every other module here is:
  # a root-scoped `go list ./...` prints only the root package, so without a job
  # of its own it would rot invisibly. UNLIKE lang/ast, lang/analysis and
  # lang/lint it HAS a go.sum — it depends on go.lsp.dev/protocol and jsonrpc2 —
  # so the cache is pointed at that file rather than omitted. Every step that
  # runs a command carries working-directory lang/lsp, because one that does not
  # would build, test or measure the root module and report a green about the
  # wrong code entirely.
  lang-lsp:
    name: lang/lsp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'lang/lsp/go.mod'
          cache-dependency-path: 'lang/lsp/go.sum'
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: lang/lsp
          args: --config ${{ github.workspace }}/.golangci.yml
          github-token: ${{ github.token }}
          only-new-issues: true
      - name: Go Build
        working-directory: lang/lsp
        run: go build ./...
      - name: Go Test
        working-directory: lang/lsp
        run: go test -timeout 600s -coverprofile=coverage.out ./...

      # The floor is the coverage the suite actually achieves, so a change that
      # drops below it fails here rather than surfacing later in a coverage
      # report. It was MEASURED against this suite rather than copied from any
      # job above: lang/ast reaches 100 because the marker methods sealing its
      # AST have empty bodies and contribute no statements, and a module wrapping
      # a third-party transport has its own profile again. What sits below 100
      # here is two things neither worth a fixture — the defensive refusal arms
      # that fire only if a consumed contract changes underneath this module, and
      # the stdio binary, whose whole body is the stream wiring that the
      # in-process pipe handshake test exercises without spawning a subprocess.
      - name: Enforce coverage floor
        working-directory: lang/lsp
        env:
          COVERAGE_FLOOR: "94"
        run: |
          total=$(go tool cover -func=coverage.out | awk '$1 == "total:" { print $NF }')
          test -n "$total" || { echo "coverage.out yielded no total line"; exit 1; }
          echo "total statement coverage: $total"
          awk -v got="${total%\%}" -v floor="$COVERAGE_FLOOR" 'BEGIN {
            if (got + 0 < floor + 0) {
              printf "coverage %s%% is below the %s%% floor\n", got, floor
              exit 1
            }
          }'

  # lang/loader is a separate module for the same reason every other module here
  # is: a root-scoped `go list ./...` prints only the root package, so without a
  # job of its own it would rot invisibly. It is also the module that exists so
  # go/types and golang.org/x/tools have exactly one home — the root module's
  # direct requirements are OTel-only and its erasure gate forbids the type
  # switch a go/types walk needs. LIKE lang/lsp and UNLIKE lang/ast,
  # lang/analysis and lang/lint it HAS a go.sum — x/tools is a real dependency —
  # so the cache is pointed at that file rather than omitted, because pointing
  # it at a file that does not exist fails the job rather than missing the
  # cache. Every step that runs a command carries working-directory lang/loader,
  # because one that does not would build, test or measure the root module and
  # report a green about the wrong code entirely.
  lang-loader:
    name: lang/loader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'lang/loader/go.mod'
          cache-dependency-path: 'lang/loader/go.sum'
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: lang/loader
          args: --config ${{ github.workspace }}/.golangci.yml
          github-token: ${{ github.token }}
          only-new-issues: true
      - name: Go Build
        working-directory: lang/loader
        run: go build ./...
      - name: Go Test
        working-directory: lang/loader
        run: go test -timeout 600s -coverprofile=coverage.out ./...

      # The floor is the coverage the suite actually achieves, so a change that
      # drops below it fails here rather than surfacing later in a coverage
      # report. It was MEASURED against this suite rather than copied from any
      # job above: lang/ast reaches 100 because the marker methods sealing its
      # AST have empty bodies and contribute no statements, and a module that
      # drives the Go toolchain has its own profile again. What sits below the
      # number here is one class, and it is not worth a fixture each: the arms
      # that fire only when the environment fails underneath the module — a
      # package set the toolchain cannot load at all, a directory that refuses
      # mid-walk, a .flow file the walk found and the OS then would not read —
      # plus the type-alias arm of the derivation walk, which needs a dependency
      # that exports one. Every arm expressing a RULE of this module is covered,
      # including each container shape the walk descends into.
      - name: Enforce coverage floor
        working-directory: lang/loader
        env:
          COVERAGE_FLOOR: "96"
        run: |
          total=$(go tool cover -func=coverage.out | awk '$1 == "total:" { print $NF }')
          test -n "$total" || { echo "coverage.out yielded no total line"; exit 1; }
          echo "total statement coverage: $total"
          awk -v got="${total%\%}" -v floor="$COVERAGE_FLOOR" 'BEGIN {
            if (got + 0 < floor + 0) {
              printf "coverage %s%% is below the %s%% floor\n", got, floor
              exit 1
            }
          }'

  lang-assembler:
    name: lang/assembler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'lang/assembler/go.mod'
          cache-dependency-path: 'lang/assembler/go.sum'
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: lang/assembler
          args: --config ${{ github.workspace }}/.golangci.yml
          github-token: ${{ github.token }}
          only-new-issues: true
      - name: Go Build
        working-directory: lang/assembler
        run: go build ./...
      - name: Go Test
        working-directory: lang/assembler
        run: go test -timeout 600s -coverprofile=coverage.out ./...

      # The floor is the coverage THIS suite actually achieves, measured rather
      # than copied from a sibling job. lang/ast reaches 100 partly because the
      # marker methods sealing its AST have empty bodies and contribute no
      # statements; a generator has no such structural help, and lang/loader
      # measured 96 for reasons of its own. The number is re-derived once the
      # module's suite is complete and moves only deliberately after that.
      - name: Enforce coverage floor
        working-directory: lang/assembler
        env:
          COVERAGE_FLOOR: "0"
        run: |
          total=$(go tool cover -func=coverage.out | awk '$1 == "total:" { print $NF }')
          test -n "$total" || { echo "coverage.out yielded no total line"; exit 1; }
          echo "total statement coverage: $total"
          awk -v got="${total%\%}" -v floor="$COVERAGE_FLOOR" 'BEGIN {
            if (got + 0 < floor + 0) {
              printf "coverage %s%% is below the %s%% floor\n", got, floor
              exit 1
            }
          }'
